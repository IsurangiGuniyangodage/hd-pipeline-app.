# === Required identifiers (from SonarCloud project) ===
sonar.projectKey=isurangithilakshanaguniyangodage_hd-pipeline-app
sonar.organization=isurangiguniyangodage
sonar.host.url=https://sonarcloud.io

# === Sources & tests ===
sonar.sources=.
sonar.tests=_tests_
sonar.test.inclusions=_tests_/**/*.js

# === Coverage (Jest generates coverage/lcov.info) ===
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8

# (optional, keeps noise down)
sonar.exclusions=node_modules/**,coverage/**,.git/**,**/*.md
